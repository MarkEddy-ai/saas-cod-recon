name: CI COD Algerie Enterprise

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Financial Integrity & Anti-RTO Tests (Agent 18)
        run: npm test

      - name: Next.js Production Build (Agent 20)
        run: npm run build
